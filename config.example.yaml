# hermes-voice-dispatch 設定範例
# 複製成 config.yaml（或任意路徑）後用 --config 指定。
# 這裡列出的值就是程式內建預設值；只需覆寫你要改的鍵即可，未列鍵沿用預設。

# 主 log 檔（daemon 生命週期）
log_file: "~/.local/state/hermes-voice-dispatch/dispatch.log"

audio:
  samplerate: 16000       # 取樣率（Hz）
  channels: 1             # 單聲道
  blocksize: 1024         # 每區塊樣本數
  device: "HiFi__Mic1__source"   # 輸入裝置：可填 index(int) 或名稱子字串(str)；null = 系統預設來源
                                 # ⚠️ 不要只靠系統預設！本機 PipeWire 預設來源是
                                 #    HiFi__Mic2__source（收不到任何聲音的死節點），
                                 #    真正的內建麥克風是 HiFi__Mic1__source。
                                 #    用 --list-devices 或 tools/probe_levels.py 確認。
                                 # 凍結自動恢復（本機 DMIC 會「開檔後立刻凍結」）：
  frozen_max_blocks: 240         # 連續多少個位元相同的區塊視為凍結（240×64ms≈15s）
  recover_command:               # 判定凍結時執行的恢復指令（重啟音訊堆疊）
    - systemctl
    - --user
    - restart
    - wireplumber
    - pipewire
    - pipewire-pulse
  recover_cooldown_sec: 120.0    # 兩次恢復最短間隔，避免一直打斷使用者的音訊
  recover_wait_sec: 7.0          # 恢復後等裝置回來
  status_file: "~/.local/state/hermes-voice-dispatch/mic-status.json"
  players:                # 播放器候選，依序嘗試，{file} 會換成檔名
    - "ffplay -nodisp -autoexit -loglevel quiet {file}"
    - "paplay {file}"
    - "aplay -q {file}"

clap:                     # 雙拍手偵測（校正方式見 README）
  rms_window_sec: 5.0     # 自適應門檻的觀察視窗（取中位數）
  threshold_mult: 4.0     # RMS 需超過「近期中位數 × 此倍數」
  abs_floor: 0.05         # RMS 絕對下限（安靜環境防誤判）
  abs_ceil: 1.2           # RMS 絕對上限（破音/雜訊排除）
  min_gap_sec: 0.12       # 兩次拍手最短間隔
  max_gap_sec: 1.5        # 兩次拍手最長間隔
  refractory_sec: 0.08    # 一次瞬變後的不反應期

wake:
  # 2026-09-26 使用者定案（原話：「能不能用波形判斷」）→ **預設走波形判斷**。
  #   "openwakeword" = 直接吃音訊波形（80ms 幀 → mel + embedding → ONNX 分類），
  #       **完全不經過 STT 文字** → 「hermes 被 Vosk 聽成 harry/army/her me」那整類
  #       漏判結構性消失（先前三輪都在補文字變體，天花板就在那裡）。
  #       離線校準（TTS 樣本）：正 'hey hermes' 0.962~0.969 命中；
  #       負 hey harry／the army／her mess／hermit／白噪音 全部 0.000~0.001。
  #       ⚠️ 代價：`import openwakeword` 實測 +182MB RSS（daemon 93MB→271MB）。
  #       想省 RAM 的正解＝只用 onnxruntime 餵三顆 ONNX（mel + embedding + hey_hermes），
  #       跳過 openwakeword 套件（見 voice_dispatch/oww.py）。
  #   "kws" = Vosk 兩階段（hey 閘門 → hermes 全詞彙確認）；"clap" = 舊拍手路徑。
  #   模型/套件不可用時會自動記 warning 並回退 "kws"。
  mode: "openwakeword"
  # 本機已訓練的 hey_hermes 模型
  oww_model: "~/.hermes/hermes-agent/tools/wakewords/hey_hermes.onnx"
  # 0.5 在離線校準裡很寬（正/負差 ~1000 倍）。真實房間分數會比 TTS 低
  # → 叫不醒往下調（0.3→0.2）、誤喚醒往上調。
  oww_threshold: 0.5
  oww_confirmation_frames: 2   # 連續幾個 80ms 幀都過門檻才算命中（2 = 寬鬆、早 80ms 醒）
  oww_vad_threshold: 0.0  # 0=關；>0 時使用 openWakeWord 內建 Silero VAD 閘控
  kws_engine: "vosk"      # "vosk"（支援任意英文詞，現行預設）/"openwakeword"
  # ══ 串接式喚醒（2026-09-26 使用者定案：極限精準 + 極限延遲）══════════════
  #  第一階段「hey」閘門（常開、極省、可 partial 即時觸發）
  #  → 第二階段「hermes」確認（全詞彙解碼 + bigram = 精度關）。
  #  使用者原話：「能先抓 hey，然後抓 hermes」。
  vosk_model: "~/.local/share/hermes-voice-dispatch/vosk-model-small-en-us-0.15"
  vosk_words:             # 第一階段閘門詞彙（只認 hey；hay 是同音）
    - "hey"
    - "hay"
  vosk_min_conf: 0.5      # 閘門 per-word 信心度門檻
  gate_partial: true      # 未定案的 partial 也算 → 最早觸發（關掉會漏判↑、延遲↑）
  verify_enabled: true    # 第二階段確認（關掉＝只靠閘門，誤判率會回到 ~8.5%）
  verify_model: ""        # 空＝沿用 vosk_model（同顆模型＝零額外記憶體/載入延遲）
  preroll_sec: 1.0        # 觸發時回看的音訊（確保窗內含完整「hey」）
  verify_window_sec: 1.5  # 觸發後最多再收多少秒去找 hermes
  verify_interval_sec: 0.15  # 收訊期間試判間隔（越小越早醒、越吃 CPU）
  verify_prefixes: [hey, hay, a, the, he, ok, okay, hi]
  verify_variants: [hermes, homes, hums, hermis, hermes's]
  verify_min_conf: 0.3    # 全詞彙 per-word 信心度門檻（否決力來自 variants 集合，見 config.py 註解）
  # 半雙工：我們自己在出聲（提示音／語音回報 TTS）時，這段時間內不做喚醒偵測。
  # 為什麼：語音回報的 TTS 是在背景 thread 播的，主迴圈同時已經回到麥克風上聽
  # → 它會把自己的聲音收進來當成「hey hermes」→ 誤喚醒 → 連響好幾聲咚咚。
  # 播放期間一定靜音；播完再等這個秒數讓殘響／裝置緩衝排掉才恢復監聽。
  # 設 0 ＝關掉半雙工（回到舊行為）。
  echo_guard_sec: 0.8
  # ── mode="clap"（舊路徑）才用 ──────────────────────────────
  window_sec: 2.5         # 拍手後錄多久去比對喚醒詞
  cooldown_sec: 10.0      # 喚醒詞沒過之後的冷卻秒數
  keywords:               # 命中任一即喚醒（比對前會正規化）
    - "hermes"
    - "赫米斯"
    - "赫密斯"
    - "哈米斯"

vad:                      # 需求錄音的能量 VAD
  speech_rms_threshold: 0.02   # 判定為語音的 RMS 門檻
  preroll_timeout_sec: 6.0     # 前置靜音等待上限
  trailing_silence_sec: 1.2    # 講完後連續靜音多久視為結束
  max_record_sec: 60.0         # 單次錄音最長
  min_record_sec: 0.5          # 單次錄音最短

confirm:                  # 回述確認
  record_sec: 3.0
  max_retries: 3          # 需求重錄上限
  max_unclear: 2          # 連續無法判定上限
  agree_words: ["對", "是", "好", "沒錯", "正確", "可以", "ok", "go", "嗯", "yes"]
  disagree_words: ["不", "錯", "重講", "再說", "重來", "no"]

tts:
  # 合成引擎："edge"＝edge-tts（免費、快，但合成腔明顯）；
  #           "gemini"＝Google Gemini TTS（更像真人，可用風格指示演出「商業大佬」口吻；
  #           免費層每 model 每天 10 次配額，會自動在多個 model 間輪替，全掛才退回 edge）。
  engine: "edge"
  # engine="edge" 時填 edge 聲音名；engine="gemini" 時填 Gemini prebuilt 聲音名。
  voice: "zh-CN-XiaoxiaoNeural"
  # 列出 edge 全部聲音：edge-tts --list-voices | grep zh
  # Gemini 常用低沉男聲：Charon / Orus / Alnilam / Algenib / Rasalgethi / Iapetus
  # ── engine="gemini" 專用 ───────────────────────────────────────────
  # 風格指示**必須**寫成這樣（# 風格指示 / # 台詞 分節），模型才會只唸台詞；
  # 若改成「請用…口吻說出：<台詞>」會被連指示一起唸出來（實測 5.3s → 14.1s）。
  gemini_style: |-
    你是一位五十歲的集團總裁，正在對全公司高層宣布決議。聲音低沉、有壓場感、
    不疾不徐，語速從容，收尾果斷。不要播報腔、不要活潑、不要上揚。
  gemini_model: "gemini-3.1-flash-tts-preview"
  gemini_model_fallbacks:
    - "gemini-3.8-flash-tts"
    - "gemini-3.8-flash-lite-tts"
    - "gemini-2.5-flash-preview-tts"
  gemini_api_key_env: "GOOGLE_API_KEY"      # 從 .env 這個變數名取 key
  gemini_env_file: "~/.hermes/.env"
  gemini_timeout_sec: 60.0
  # 品質守門：合成後「字/秒」低於此值＝Gemini 很可能把風格指示也唸出來 → 去掉指示重合成。
  gemini_min_cps: 3.0
  # 語速：優先用 speak_cps 正規化（每秒幾個字，跨 model 一致）；0＝改用 speed 固定倍率。
  # 同一 voice 在不同 Gemini model 語速差很多（3.1→4.6s／3.8→5.72s／lite→6.64s），
  # 而免費層配額用完會自動換 model，所以固定倍率會忽快忽慢。
  speak_cps: 5.2
  speed: 1.0
  # edge 引擎的語速字串（gemini 靠上面的 speak_cps 控）
  rate: "+30%"
  ok_prompt: "OK，請說出你的需求。"
  confirm_template: "我理解成：{transcript}。對嗎？"
  unclear_prompt: "抱歉我沒聽清楚，請再說一次要或不要。"
  give_up_prompt: "我先放棄，請再說一次。"
  dispatched_prompt: "好的，已經派工出去了。"
  beep_enabled: False     # 機器感的「嗶」（chime 模式用不到）
  beep_freq: 880.0
  beep_dur_sec: 0.18
  beep_volume: 0.3
  # 提示模式（2026-09-25 使用者指定）：
  #   "chime"（預設）＝整個互動只用「咚咚」兩聲、完全不講話：
  #       喚醒 → 咚（tone1）咚（tone2）；聽完需求（有講／沒講都算）→ 再一次咚咚。
  #   "voice"＝舊行為（edge-tts 講 ok_prompt / retry_prompts / dispatched_prompt）。
  prompt_mode: "chime"
  chime_tone1_hz: 784.0    # 第一聲「咚」（G5）
  chime_tone2_hz: 523.25   # 第二聲「咚」（C5，下行完全四度）
  chime_tone_dur_sec: 0.16
  chime_gap_sec: 0.07      # 兩聲之間的縫
  chime_volume: 0.35
  # 音源：`"files"`＝播原廠素材音檔（**有素材就優先用這個**）；`"synth"`＝合成退路。
  # 合成版被使用者退貨兩次（「空洞」「這他媽是火車」），所以正式用素材。
  # 素材不入 repo（版權），放在使用者家目錄，路徑只在 config.yaml 裡出現。
  chime_source: "synth"
  chime_files: []            # 例：["~/.local/share/hermes-voice-dispatch/chime/cue_1_Glass_macOS.mp3"]
  # 開頭／結尾各掛不同音（「一聲高一聲低，像 Discord 開關 mic，但不要一樣」）。
  # 留空＝兩邊都用上面的 chime_files。
  chime_start_files: []
  chime_end_files: []
  chime_file_max_sec: 2.5    # 單一素材最長取用秒數

stt:
  scoped_script: "~/.hermes/scripts/voice_task/stt_scoped.sh"
  model: ""               # 空 = 用腳本預設模型
  timeout_sec: 180.0
  ffmpeg_bin: "ffmpeg"

discord:
  api_base: "https://discord.com/api/v10"
  channel_id: "1392008000197365870"    # #人工智障
  guild_id: "1340241728959025236"
  auto_archive_duration: 1440          # thread 自動封存（分鐘）
  thread_name_limit: 100               # Discord thread 名長度上限
  # 母頻道那一則（同時是討論串開頭）＝需求原文本身。預設只留需求那段、不加標題／
  # emoji／時間（2026-09-26 使用者：「只留需求那段」「語音任務不用特地說」）。
  card_template: "{transcript}"
  # 自動把使用者加入討論串（語音派工的串是 bot 開的，他預設不在成員名單、
  # 收不到通知）。填 Discord user id；空字串＝不加入。
  user_id: ""
  # 討論串名稱：直接用需求前幾字。
  thread_name_template: "{short}"
  thread_short_len: 40
  # 串內再補一則任務卡（**留空＝不發**）。
  task_card_template: ""
  # 派工通知（**留空＝不發**；gateway 接手後自己會回，這則是多餘的）。
  dispatched_notice: ""
  env_file: "~/.hermes/.env"           # 讀 DISCORD_BOT_TOKEN 的來源
  token_env: "DISCORD_BOT_TOKEN"
  timeout_sec: 30.0

dispatch:
  hermes_bin: "hermes"
  log_dir: "~/.local/state/hermes-voice-dispatch/dispatch"
  prompt_template: |-
    你剛收到一則使用者用「語音」下的需求（語音派工）。需求原文：
    「{transcript}」

    請把這件事當成一般任務處理，並把過程與結果完整回報到這條 Discord 討論串：
      channel_id={channel_id}  thread_id={thread_id}
    回報指令：hermes send --to discord:{channel_id}:{thread_id} "<訊息>"

    步驟：
    1. 先在串內發一則開工訊息，說明你打算怎麼做。
    2. 執行過程中把重要進度發到串內（不要沉默太久）。
    3. 若中途需要使用者確認，就在串內發問並停下來等；使用者會直接在串內回覆你。
    4. 完成後把結果發到串內，包含你實際做了什麼、怎麼驗證的。若失敗也要回報失敗原因。

relay:
  # 把語音需求當成「一則 @Hermes 的使用者訊息」送進討論串 → gateway 用它原本那條路
  # 處理（同一條 session、typing、逐字串流、後續追問接續＝跟打字完全一樣）。
  # 前提：gateway 的 ~/.hermes/.env 要有 DISCORD_ALLOW_BOTS=mentions，且
  # streaming.enabled=true。webhook URL（含 token）存在 .env 的
  # DISCORD_RELAY_WEBHOOK_URL；不填＝停用，回退 spawn `hermes -z`。
  enabled: true
  mention_id: "1520796555580543138"   # gateway bot 的 user id（要 @ 它才會被收）
  # 發話顯示名稱：留空＝**模仿 Hermes bot 自己**（daemon 用 GET /users/@me 取名字＋
  # 頭像）。要固定字串就在這裡填。
  username: ""
  timeout_sec: 20.0
