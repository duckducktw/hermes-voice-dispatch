# hermes-voice-dispatch 的回音消除麥克風（monitor.mode）
#
# 2026-09-28。目的：「電腦發出來的聲音不納入語音辨識，電腦發出來不被錄」。
#
# ⚠️ 關鍵：`monitor.mode = true`
#   這是官方支援的模式（docs.pipewire.org/page_module_echo_cancel.html）——
#   參考訊號直接從**預設 sink 的 monitor 埠**取，**不建立 AEC sink、完全不碰播放路徑**。
#
#   對比（同日先踩過的坑）：預設的 sink 模式會產生一個 AEC sink，必須把預設 sink
#   切過去、所有播放都經 webrtc 處理 → **喇叭變電音**（使用者：「靠，我的喇叭電音」）。
#   monitor.mode 沒有這個問題：喇叭輸出原封不動，只有麥克風那一側被處理。
#
# 產出：一個名為 HermesMicAEC 的 source（麥克風訊號已減掉喇叭正在放的內容）。
# daemon 的 config.yaml 用 audio.device: "HermesMicAEC" 指到它。
#
# 套用：systemctl --user restart pipewire pipewire-pulse wireplumber
#       （或重新登入；這個 conf.d 檔開機會自動載入，不必手動 pactl load-module）

context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      # 從預設 sink 的 monitor 取參考訊號 → 不建 sink、不改播放路徑
      monitor.mode = true
      # 麥克風端（實體 USB 麥克風）
      capture.props = {
        node.name       = "HermesAecCapture"
        node.target     = "alsa_input.usb-Generalplus_WordForum_USB-00.mono-fallback"
        audio.rate      = 48000
        audio.channels  = 1
        audio.position  = [ MONO ]
      }
      # 對外提供的、已消除回音的 source（daemon 讀這個）
      source.props = {
        node.name       = "HermesMicAEC"
        node.description = "Hermes AEC Microphone (echo-cancelled)"
        audio.rate      = 48000
        audio.channels  = 1
        audio.position  = [ MONO ]
      }
      aec.args = {
        # 關掉 AGC / 噪音抑制：只要回音消除。
        # AGC 會讓電平忽大忽小、NS 會吃掉字頭，兩者都會害到喚醒判定與 STT。
        webrtc.gain_control          = false
        webrtc.noise_suppression     = false
        webrtc.high_pass_filter      = true
        webrtc.echo_canceller_mobile = false
        webrtc.voice_detection       = false
      }
    }
  }
]
